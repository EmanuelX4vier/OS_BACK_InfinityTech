spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

# CORRIGIDO: jwt deve estar no nível raiz, não dentro de spring:
jwt:
  secret: ${JWT_SECRET}
  refresh-token-expiration-days: 7

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

server:
  port: 8080
